<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastrar Produto</title>
</head>

<header>
    <h1>Nome da loja</h1>
</header>

<body>
<div class="container">
    <main>
        <div class="cadastro-container">
            <div class="cadastro-header">
                <h2>Cadastrar Novo Produto</h2>
                <a href="index.html" class="btn-voltar">← Voltar para a loja</a>
            </div>

            <form id="form-cadastro" class="form-produto">
                <div class="form-group">
                    <label for="nome">Nome do Produto *</label>
                    <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Ex: Guitarra Fender Stratocaster"
                            required
                            minlength="3"
                            maxlength="100">
                    <span class="error-message" id="error-nome"></span>
                </div>

                <div class="form-group">
                    <label for="valor">Preço (R$) *</label>
                    <input
                            type="number"
                            id="valor"
                            name="valor"
                            placeholder="0.00"
                            step="0.01"
                            min="0.01"
                            required>
                    <span class="error-message" id="error-valor"></span>
                </div>

                <div class="form-group">
                    <label for="imagemUrl">URL da Imagem *</label>
                    <input
                            type="url"
                            id="imagemUrl"
                            name="imagemUrl"
                            placeholder="https://exemplo.com/imagem.jpg"
                            required>
                    <span class="error-message" id="error-imagemUrl"></span>
                </div>

                <div class="form-group preview-group">
                    <label>Preview da Imagem</label>
                    <div id="preview-container" class="preview-container">
                        <p class="preview-placeholder">A imagem aparecerá aqui quando você inserir a URL</p>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        <span class="btn-text">Cadastrar Produto</span>
                        <span class="btn-loading" style="display: none;">Cadastrando...</span>
                    </button>
                    <button type="reset" class="btn-reset">Limpar Formulário</button>
                </div>

                <div id="message-container" class="message-container"></div>
            </form>
        </div>
    </main>
</div>
<script src="cadastro.js"></script>
</body>

</html>
